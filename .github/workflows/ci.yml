# The repo's branch-protection ruleset requires a status check named exactly
# `ci`. The job below is named `ci` — both the job name and its `name:` key — so
# the check this workflow reports is the one the ruleset gates on.
#
# `ci` is the ONLY check that gates a merge, and it deliberately touches no
# secret: every step either really runs or the job fails.
#
# The live testnet suite is deliberately NOT here. It is:
#   (a) required locally before any PR that touches the enforcement path, with
#       fresh evidence committed and checked by the `enforcement-path evidence
#       gate` step below (a file-list check — no network, no secret); and
#   (b) run automatically by `.github/workflows/live-suite.yml` on a weekly
#       schedule, to catch host/testnet drift.
#
# A green `ci` means the required checks ran. It does not mean the live suite ran
# against this change — the evidence file it points at is the record for that.
#
# ---------------------------------------------------------------------------
# Pipeline shape (issue #101) — why two jobs, and why not more:
#
#   * `npm ci` runs once per job, and `actions/setup-node` restores the npm
#     cache keyed on `package-lock.json` (`cache: npm`), so the second job's
#     install is a cache hit. There is deliberately no fan-out for
#     typecheck/lint/test/build: splitting those would pay the ~5s install and
#     ~3s node setup again in every job for no parallel win, because each already
#     runs in a couple of seconds.
#   * The one split is the informational benchmark, and it is a *latency* split.
#     `decode-path benchmarks (informational)` is `continue-on-error: true`, is
#     never a gate, and at ~16s it was the largest single step in the required
#     job (~29% of a ~55s run; see the five linked runs on issue #101). Running
#     it in a parallel `bench` job keeps it running on every push and PR — so
#     `docs/benchmarks.md` stays accurate — while taking it off the critical
#     path of the check that actually blocks merges. This is the issue's
#     "justified split with shared cache": the parallel saving (~16s off the
#     required check) exceeds the extra parallel work (~8s of setup + install).
#   * Steps inside `ci` are ordered cheapest-first — typecheck, lint and build
#     are ~2s each — so a broken change fails fast instead of after the ~14s test
#     suite. `build` precedes `unit tests` because the smoke and export-map steps
#     consume `dist/`, so a compile error surfaces before the slower gates run.
#
# Every gate is still enforced; none is dropped, and none moved out of `ci`:
#   typecheck -> `typecheck`        lint      -> `lint`
#   test      -> `unit tests`       build     -> `build`
#   (plus `smoke test export resolution`, `export-map resolution (pack + install
#    + import)`, `evidence structure check`, and `enforcement-path evidence gate`.)
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI inspects the repo and runs tests; it never writes to it.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the evidence gate can diff the PR against its base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      # Cheapest static gates first (~2s each): a typo or lint error should fail
      # the run before the ~14s test suite or the ~6s pack/install step starts.
      - name: typecheck
        run: npm run typecheck

      # The strictness ratchet (issue #137): `strict`,
      # `noUncheckedIndexedAccess` and `exactOptionalPropertyTypes` are on, and
      # this guard fails the required check if any is later flipped off or
      # dropped from tsconfig.json / tsconfig.build.json (following `extends`).
      # `typecheck` alone cannot catch that: turning a flag off makes typecheck
      # *pass* more easily, not fail.
      - name: strictness ratchet
        run: npm run check:strict-ratchet

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm test

      # Coverage floor on the verdict-critical path (src/preflight.ts,
      # src/policy.ts, src/invoke.ts). `c8` reads `.c8rc.json`, so the floor
      # lives in one place and is raised by a deliberate PR. Runs the unit
      # suite again under instrumentation; no network, no secret, so it cannot
      # go green on a missing credential.
      - name: coverage floor (verdict-critical path)
        run: npm run test:coverage:floor

      - name: build
        run: npm run build

      # Browser-safe core (issue #325): bundle the built root entry for the
      # browser with no `node:*` externals. A Node-only import reachable from
      # the root entry fails here instead of in a consumer's bundler.
      - name: browser root-entry smoke test
        run: npm run test:browser

      # Packed-consumer declaration smoke test (issue #327): pack the built
      # package, install it into a temp consumer, and compile a fixture that
      # imports only public values/types. Source-tree typecheck cannot see a
      # missing or mis-pathed declaration in the published tarball.
      - name: packed-consumer TypeScript declarations
        run: npm run test:types:packed

      - name: unit tests
        run: npm test

      - name: smoke test export resolution
        run: npm run test:smoke

      # Pack the tarball, install it into a temp consumer, and import the root
      # and every declared subpath through a real resolver — and prove that a
      # path *not* in the export map is refused. The smoke step above imports
      # dist/ in-place; this one exercises the published artifact.
      - name: export-map resolution (pack + install + import)
        run: npm run test:exports

      # Browser-consumer bundle-size canary (issue #145): the dashboard imports
      # the SDK client-side, so this number ships to every operator's browser.
      # esbuild is already in the dev tree (tsx's binary), so this adds no new
      # package; the budget lives in scripts/bundle-size.budget.json with the
      # headroom rationale, and a breach fails this job with the re-baseline
      # protocol in the error text.
      - name: bundle-size canary (dashboard import shape)
        run: npm run check:bundle-size

      # Informational only, never gating: shared runners are too noisy for a
      # wall-time threshold to mean anything. The committed baseline lives in
      # docs/benchmarks.md; compare changes on a developer machine, not here.
      - name: decode-path benchmarks (informational)
        run: npm run bench
        continue-on-error: true

      # Structural validation of the evidence record (issue #65): asserts the
      # document's expected sections and row minimums, and fails loudly when its
      # shape drifts. This is what stops the file-list gate below going vacuously
      # green on a document nothing can parse. No network, no secret.
      - name: evidence structure check
        run: node scripts/check-enforcement-evidence.ts --check-structure

      # A PR that changes the enforcement path must ship fresh live-testnet
      # evidence in the same PR. This checks the file list only: no network, no
      # secret, so it cannot go green on a missing credential.
      - name: enforcement-path evidence gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/check-enforcement-evidence.ts "origin/$BASE_REF" HEAD

  # Informational only, never gating — and deliberately a separate job so it does
  # not lengthen the required `ci` check (see the header comment). It runs on
  # every push and PR. The npm cache is shared with `ci` via the same
  # setup-node `cache: npm` key (same lockfile), so this job's install is a
  # cache hit.
  bench:
    name: bench (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      # Informational only, never gating: shared runners are too noisy for a
      # wall-time threshold to mean anything. The committed baseline lives in
      # docs/benchmarks.md; compare changes on a developer machine, not here.
      # `continue-on-error` keeps a noisy run from reddening the workflow for a
      # number that is never a gate.
      - name: decode-path benchmarks (informational)
        run: npm run bench
        continue-on-error: true
